name: 'SQU Theme'
type: theme
description: 'Custom header, hamburger mega-menu, Layout Builder-ready homepage and footer theme for Sultan Qaboos University.'
package: Custom
core_version_requirement: ^11
base theme: olivero

libraries:
  - squ_theme/global

libraries-override:
  olivero/global-styling: false

regions:
  header_brand: 'Header Brand'
  header_tools: 'Header Tools'
  header_lang: 'Header language'
  header_section: 'Header Section menu'
  header_drawer: 'Header Drawer menu'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  content: Content
  sidebar_first: Sidebar
  footer_top: 'Footer Top'
  footer_bottom: 'Footer Bottom'
